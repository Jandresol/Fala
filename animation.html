
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fala Architecture — Click to Advance</title>
<style>
  :root{
    --bg:#f7f3ec;
    --ink:#1f1b18;
    --muted:#756a60;
    --line:#cfc4b8;
    --panel:#fffdfa;
    --blue:#416f8f;
    --blue-soft:#e8f0f5;
    --red:#9e4a3f;
    --red-soft:#f7e6e2;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:var(--bg);
    color:var(--ink);
    font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .wrap{
    width:min(980px,94vw);
    padding:26px 0 22px;
    text-align:center;
  }

  .eyebrow{
    margin:0 0 6px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  h1{
    margin:0;
    font-family:Georgia, "Times New Roman", serif;
    font-size:clamp(30px,4vw,48px);
    font-weight:600;
    letter-spacing:-.03em;
  }

  .hint{
    margin:10px 0 20px;
    font-size:14px;
    color:var(--muted);
  }

  .stage{
    background:rgba(255,255,255,.42);
    border:1px solid rgba(117,106,96,.16);
    border-radius:28px;
    padding:24px;
  }

  svg{
    width:100%;
    height:auto;
    display:block;
    cursor:pointer;
    user-select:none;
  }

  .step{
    opacity:0;
    transform:translateY(10px) scale(.985);
    transform-origin:center;
    transition:
      opacity .35s ease,
      transform .35s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
  }

  .step.visible{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .title{
    font-size:17px;
    font-weight:650;
    fill:var(--ink);
    letter-spacing:-.01em;
  }

  .sub{
    font-size:12.5px;
    font-weight:500;
    fill:var(--muted);
  }

  .section-label{
    font-size:13px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    fill:var(--muted);
  }

  .counter{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
  }

  @media (max-width:700px){
    .stage{padding:12px;border-radius:20px}
    .hint{font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="diagram" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" aria-label="Fala web application architecture">
      <defs>
        <marker id="arrowInk" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto">
          <path d="M0,0 L9,3 L0,6 Z" fill="#6f675f"/>
        </marker>
        <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto">
          <path d="M0,0 L9,3 L0,6 Z" fill="#416f8f"/>
        </marker>
      </defs>

      <!-- 1 Frontend -->
      <g class="step">
        <rect x="38" y="38" width="176" height="64" rx="14" fill="#fffdfa" stroke="#bdb2a7" stroke-width="1.8"/>
        <text x="126" y="62" text-anchor="middle" class="title">Frontend</text>
        <text x="126" y="84" text-anchor="middle" class="sub">Everything you see</text>
      </g>

      <!-- 2 Backend + arrow -->
      <g class="step">
        <line x1="214" y1="70" x2="258" y2="70" stroke="#6f675f" stroke-width="2" marker-end="url(#arrowInk)"/>
        <rect x="260" y="38" width="176" height="64" rx="14" fill="#fffdfa" stroke="#bdb2a7" stroke-width="1.8"/>
        <text x="348" y="62" text-anchor="middle" class="title">Backend</text>
        <text x="348" y="84" text-anchor="middle" class="sub">The logic</text>
      </g>

      <!-- 3 Database + arrow -->
      <g class="step">
        <line x1="436" y1="70" x2="480" y2="70" stroke="#6f675f" stroke-width="2" marker-end="url(#arrowInk)"/>
        <rect x="482" y="38" width="176" height="64" rx="14" fill="#fffdfa" stroke="#bdb2a7" stroke-width="1.8"/>
        <text x="570" y="62" text-anchor="middle" class="title">Database</text>
        <text x="570" y="84" text-anchor="middle" class="sub">The memory</text>
      </g>

      <!-- 4 AI section -->
      <g class="step">
        <line x1="348" y1="102" x2="348" y2="147" stroke="#6f675f" stroke-width="2" marker-end="url(#arrowInk)"/>
        <rect x="54" y="158" width="592" height="126" rx="20" fill="#fbfaf7" stroke="#cfc4b8" stroke-width="1.6" stroke-dasharray="7 7"/>
        <text x="76" y="183" class="section-label">Models</text>
      </g>

      <!-- 5 Whisper -->
      <g class="step">
        <rect x="76" y="204" width="158" height="54" rx="13" fill="#e8f0f5" stroke="#416f8f" stroke-width="1.8"/>
        <text x="155" y="224" text-anchor="middle" class="title" fill="#416f8f">Whisper</text>
        <text x="155" y="244" text-anchor="middle" class="sub">Speech → text</text>
      </g>

      <!-- 6 Qwen + arrow -->
      <g class="step">
        <line x1="234" y1="231" x2="270" y2="231" stroke="#416f8f" stroke-width="2" marker-end="url(#arrowBlue)"/>
        <rect x="272" y="204" width="158" height="54" rx="13" fill="#e8f0f5" stroke="#416f8f" stroke-width="1.8"/>
        <text x="351" y="224" text-anchor="middle" class="title" fill="#416f8f">Qwen</text>
        <text x="351" y="244" text-anchor="middle" class="sub">Generates a response</text>
      </g>

      <!-- 7 Piper + arrow -->
      <g class="step">
        <line x1="430" y1="231" x2="466" y2="231" stroke="#416f8f" stroke-width="2" marker-end="url(#arrowBlue)"/>
        <rect x="468" y="204" width="158" height="54" rx="13" fill="#e8f0f5" stroke="#416f8f" stroke-width="1.8"/>
        <text x="547" y="224" text-anchor="middle" class="title" fill="#416f8f">Piper</text>
        <text x="547" y="244" text-anchor="middle" class="sub">Text → speech</text>
      </g>

      <!-- 8 Final Fala -->
      <g class="step">
        <line x1="348" y1="284" x2="348" y2="323" stroke="#6f675f" stroke-width="2" marker-end="url(#arrowInk)"/>
        <rect x="232" y="330" width="232" height="58" rx="20" fill="#f7e6e2" stroke="#9e4a3f" stroke-width="2"/>
        <text x="348" y="365" text-anchor="middle" class="title" fill="#9e4a3f" style="font-size:18px">Web Application</text>
      </g>
    </svg>
  </div>
</div>

<script>
  const diagram = document.getElementById('diagram');
  const steps = Array.from(document.querySelectorAll('.step'));
  let index = 0;

  function updateCounter(){
    counter.textContent = `${index} / ${steps.length}`;
  }

  function advance(){
    if(index < steps.length){
      steps[index].classList.add('visible');
      index++;
    }
  }

  function reset(){
    steps.forEach(step => step.classList.remove('visible'));
    index = 0;
  }

  diagram.addEventListener('click', advance);

  document.addEventListener('keydown', e => {
    if(e.key.toLowerCase() === 'r') reset();
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') advance();
  });

  updateCounter();
</script>
</body>
</html>
